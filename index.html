<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DSA Pattern Tracker</title>
  <meta name="description" content="Track 299 LeetCode problems by pattern with 3- and 7-day re-solves and pattern notes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A73EB'/%3E%3Cpath d='M12 9c-2.5 0-2.5 2-2.5 4s-1.2 3-2.5 3c1.3 0 2.5 1 2.5 3s0 4 2.5 4M20 9c2.5 0 2.5 2 2.5 4s1.2 3 2.5 3c-1.3 0-2.5 1-2.5 3s0 4-2.5 4' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Show patterns" aria-expanded="false" aria-controls="rail">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#today">
      <span class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6c-2 0-2 1.6-2 3.2S6 12 5 12c1 0 2 .6 2 2.8S7 18 9 18"/><path d="M15 6c2 0 2 1.6 2 3.2s1 2.8 2 2.8c-1 0-2 .6-2 2.8S17 18 15 18"/></svg>
      </span>
      <span>DSA tracker</span>
    </a>
    <div class="top-stats" id="topStats" aria-live="polite"></div>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings and backup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Patterns"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>

  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" class="dialog-body" id="settingsForm">
      <div class="dialog-head">
        <h2 id="settingsTitle">Settings and backup</h2>
        <button class="icon-btn ghost" value="close" aria-label="Close settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <fieldset>
        <legend>Practice rules</legend>
        <div class="field-grid">
          <label class="field">
            <span>Clean solve, max minutes</span>
            <input type="number" name="cleanMinutes" min="5" max="180" step="1" required>
          </label>
          <label class="field">
            <span>First re-solve after (days)</span>
            <input type="number" name="gap1" min="1" max="30" step="1" required>
          </label>
          <label class="field">
            <span>Final re-solve after (days)</span>
            <input type="number" name="gap2" min="1" max="60" step="1" required>
          </label>
          <label class="field">
            <span>New problems per day</span>
            <input type="number" name="dailyNew" min="1" max="10" step="1" required>
          </label>
        </div>
        <label class="check">
          <input type="checkbox" name="coreFirst">
          <span>Pick ★ core problems first for new work</span>
        </label>
        <label class="field">
          <span>Theme</span>
          <select name="theme">
            <option value="auto">Match my device</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Your data</legend>
        <p class="muted small">Progress lives in this browser only. Export a backup now and then, and import it on another device.</p>
        <div class="btn-row">
          <button type="button" class="btn secondary" id="exportBtn">Export backup</button>
          <label class="btn secondary file-btn">
            Import backup
            <input type="file" id="importFile" accept="application/json,.json">
          </label>
          <button type="button" class="btn danger-ghost" id="resetBtn">Reset everything</button>
        </div>
      </fieldset>

      <div class="dialog-foot">
        <button type="button" class="btn primary" id="saveSettingsBtn">Save settings</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">This tracker needs JavaScript turned on.</p></noscript>

  <script src="problems.js"></script>
  <script src="app.js"></script>
</body>
</html>
